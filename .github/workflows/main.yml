name: Build Pure Python Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t microgrid-backend:final .
          docker save -o microgrid-api-final.tar microgrid-backend:final

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microgrid-docker-image
          path: microgrid-api-final.tar
